<script>
/* Runs before the body paints: a stored choice wins, otherwise the system's.
   Without this the page would flash the light default at anyone on dark. */
(function(){
  var t=null;
  try{t=localStorage.getItem('yl-theme')}catch(e){}
  if(t!=='light'&&t!=='dark'){
    t=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  }
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">

<header class="topbar">
  <span class="t-name">Yi Lin</span>
  <button class="burger" aria-label="Open menu" aria-expanded="false" onclick="toggleDrawer()"><span></span><span></span><span></span></button>
</header>
<div class="scrim" onclick="toggleDrawer(false)"></div>

<div class="app">
  <aside class="side" id="side">
    <div class="who">
      <div class="reg-mini" aria-hidden="true"></div>
      <h1>Yi Lin</h1>
      <p class="disc">UX/UI Design + Product Design</p>
    </div>
    <!-- Filled by renderSidebar() from CASES, so the case list is written
         down once rather than once per page. -->
    <nav class="worknav" id="worknav" aria-label="Sections"></nav>
    <!-- Contact is here rather than on a page of its own. It was sixteen
         words at the bottom of a scroll; as a destination it made someone
         navigate away at the exact moment they had decided to get in touch. -->
    <div class="foot">
      <div class="foot-links">
        <a href="https://artyilin.com" target="_blank" rel="noopener">Website</a>
        <a href="https://www.linkedin.com/in/yilin11/" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://artyilin.com/contact/" target="_blank" rel="noopener">Get in touch</a>
      </div>
      <p class="foot-place">Based in New York City</p>
    </div>
  </aside>

  <main class="main">
    <div class="workspace" id="workspace" data-view="grid">
      <div class="ws-head">
        <h2>Selected work</h2>
        <div class="ws-tools">
          <div class="viewtoggle" role="group" aria-label="View mode">
            <button aria-pressed="true" id="vtGrid" onclick="setView('grid')" aria-label="Grid view">▦</button>
            <button aria-pressed="false" id="vtList" onclick="setView('list')" aria-label="List view">☰</button>
          </div>
          <button class="themebtn" id="themeBtn" onclick="toggleTheme()"></button>
        </div>
      </div>
      <div class="grid" id="gridEl"></div>
      <div class="list" id="listEl"></div>
    </div>

  </main>
</div>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="v-bar">
    <span class="v-crumb">Yi Lin / <b id="vCrumb">—</b></span>
    <div class="v-actions">
      <button onclick="stepCase(-1)" aria-label="Previous case">‹</button>
      <button onclick="stepCase(1)" aria-label="Next case">›</button>
      <button onclick="closeCase()" aria-label="Close">✕ Close</button>
    </div>
  </div>
  <div class="v-hero" id="vHero"></div>
  <div class="v-content" id="vContent"></div>
</div>

<script src="app.js"></script>
